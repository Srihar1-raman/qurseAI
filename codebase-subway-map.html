        const stations = [];
        const lines = [];
        
        function createStation(x, y, name, size = 8, color = '#fff') {
            const data = stationData[name] || { category: 'Unknown', color, description: 'No description available.', files: [], features: [] };
            stations.push({ 
                x, y, name, size, color,
                category: data.category,
                description: data.description,
                files: data.files,
                features: data.features
            });
        }
        
        function createLine(color, stationNames) {
            const lineStations = stationNames.map(name => 
                stations.find(s => s.name === name)
            ).filter(Boolean);
            lines.push({ color, stations: lineStations });
        }

            { from: 'Login', to: 'Auth' },
            { from: 'Chat', to: 'Chat Comp' },
            { from: 'Conversation', to: 'Conv Comp' },
            { from: 'Pricing', to: 'Pricing Comp' },
            { from: 'Settings', to: 'Settings Comp' },
            { from: 'Conversations', to: 'Conversation' },
            { from: 'Activity', to: 'Activity Lib' },
            { from: 'Payments', to: 'Subscription' },
            { from: 'DB', to: 'Supabase' },
        ];
        
        function transformPoint(x, y) {
            return {
                x: x * scale + offsetX,
                y: y * scale + offsetY
            };
        }
        
        function inverseTransformPoint(x, y) {
            return {
                x: (x - offsetX) / scale,
                y: (y - offsetY) / scale
            };
        }
        
        function drawOrthogonalLine(p1, p2, color, lineWidth = 6, dashed = false) {
            const tp1 = transformPoint(p1.x, p1.y);
            const tp2 = transformPoint(p2.x, p2.y);
            
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth * scale;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            if (dashed) {
                ctx.setLineDash([8 * scale, 6 * scale]);
            }
            
            ctx.moveTo(tp1.x, tp1.y);
            
            const midX = (p1.x + p2.x) / 2;
            const midY = (p1.y + p2.y) / 2;
            const tmid1 = transformPoint(midX, p1.y);
            const tmid2 = transformPoint(midX, p2.y);
            
            if (Math.abs(p1.x - p2.x) > Math.abs(p1.y - p2.y)) {
                ctx.lineTo(tmid1.x, tmid1.y);
                ctx.lineTo(tmid2.x, tmid2.y);
            } else {
                const tmid1 = transformPoint(p1.x, midY);
                const tmid2 = transformPoint(p2.x, midY);
                ctx.lineTo(tmid1.x, tmid1.y);
                ctx.lineTo(tmid2.x, tmid2.y);
            }
            
            ctx.lineTo(tp2.x, tp2.y);
            ctx.stroke();
            ctx.setLineDash([]);
        }
        
        function drawLine(line) {
            if (line.stations.length < 2) return;
            
            for (let i = 0; i < line.stations.length - 1; i++) {
                drawOrthogonalLine(line.stations[i], line.stations[i+1], line.color, 8);
            }
        }
        
        function drawTransfer(from, to) {
            const fromStation = stations.find(s => s.name === from);
            const toStation = stations.find(s => s.name === to);
            if (!fromStation || !toStation) return;
            
            const tp1 = transformPoint(fromStation.x, fromStation.y);
            const tp2 = transformPoint(toStation.x, toStation.y);
            
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.lineWidth = 3 * scale;
            ctx.lineCap = 'round';
            ctx.setLineDash([10 * scale, 8 * scale]);
            
            ctx.moveTo(tp1.x, tp1.y);
            
            const dx = tp2.x - tp1.x;
            const dy = tp2.y - tp1.y;
            
            const controlX1 = tp1.x + dx * 0.25;
            const controlY1 = tp1.y + (dy > 0 ? 1 : -1) * 40 * scale;
            
            const controlX2 = tp2.x - dx * 0.25;
            const controlY2 = tp2.y + (dy > 0 ? 1 : -1) * 40 * scale;
            
            ctx.bezierCurveTo(controlX1, controlY1, controlX2, controlY2, tp2.x, tp2.y);
            ctx.stroke();
            ctx.setLineDash([]);
        }
        
        function drawStation(station) {
            const tp = transformPoint(station.x, station.y);
            const isHub = station.size >= 11;
            const isHovered = hoveredStation === station;
            const isSelected = selectedStation === station;
            
            const size = station.size * scale;
            
            if (isHovered || isSelected) {
                ctx.beginPath();
                ctx.fillStyle = isSelected ? station.color : 'rgba(255,255,255,0.15)';
                ctx.arc(tp.x, tp.y, size + 10 * scale, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.beginPath();
            ctx.fillStyle = station.color;
            ctx.arc(tp.x, tp.y, size, 0, Math.PI * 2);
            ctx.fill();
            
            if (isHub) {
                ctx.beginPath();
                ctx.fillStyle = '#fff';
                ctx.arc(tp.x, tp.y, size * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
            
            if (scale > 0.5) {
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${11 * scale}px -apple-system, BlinkMacSystemFont, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                const textY = tp.y + size + 18 * scale;
                
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 4 * scale;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 2 * scale;
                ctx.fillText(station.name, tp.x, textY);
                ctx.shadowColor = 'transparent';
            }
        }
        
        function draw() {
            ctx.fillStyle = '';
            ctx.clearRect(0, 0, width, height);
            
            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            
            for (let x = 0; x < width; x += 40 * scale) {
                const drawX = (x + offsetX % (40 * scale)) % (width + 80 * scale) - 40 * scale;
                ctx.beginPath();
                ctx.moveTo(drawX, 0);
                ctx.lineTo(drawX, height);
                ctx.stroke();
            }
            
            for (let y = 0; y < height; y += 40 * scale) {
                const drawY = (y + offsetY % (40 * scale)) % (height + 80 * scale) - 40 * scale;
                ctx.beginPath();
                ctx.moveTo(0, drawY);
                ctx.lineTo(width, drawY);
                ctx.stroke();
            }
            
            transfers.forEach(t => drawTransfer(t.from, t.to));
            lines.forEach(drawLine);
            stations.forEach(drawStation);
        }
        
        function getStationAtPoint(x, y) {
            const p = inverseTransformPoint(x, y);
            for (const station of stations) {
                const dist = Math.sqrt(Math.pow(station.x - p.x, 2) + Math.pow(station.y - p.y, 2));
                if (dist < station.size + 10) {
                    return station;
                }
            }
            return null;
        }
        
        function showInfoPanel(station) {
            selectedStation = station;
            document.getElementById('infoTitle').textContent = station.name;
            document.getElementById('infoTag').textContent = station.category;
            document.getElementById('infoTag').style.background = station.color;
            document.getElementById('infoDescription').textContent = station.description;
            
            const filesContainer = document.getElementById('infoFiles');
            filesContainer.innerHTML = '';
            station.files.forEach(file => {
                const item = document.createElement('div');
                item.className = 'info-panel-item';
                item.textContent = file;
                filesContainer.appendChild(item);
            });
            document.getElementById('infoFilesSection').style.display = station.files.length > 0 ? 'block' : 'none';
            
            const featuresContainer = document.getElementById('infoFeatures');
            featuresContainer.innerHTML = '';
            station.features.forEach(feature => {
                const item = document.createElement('div');
                item.className = 'info-panel-item';
                item.textContent = feature;
                featuresContainer.appendChild(item);
            });
            document.getElementById('infoFeaturesSection').style.display = station.features.length > 0 ? 'block' : 'none';
            
            infoPanel.classList.add('active');
            draw();
        }
        
        function hideInfoPanel() {
            selectedStation = null;
            infoPanel.classList.remove('active');
            draw();
        }
        
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const station = getStationAtPoint(x, y);
            if (station) {
                showInfoPanel(station);
                return;
            }
            
            isDragging = true;
            lastX = x;
            lastY = y;
            hideInfoPanel();
        });
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (isDragging) {
                offsetX += x - lastX;
                offsetY += y - lastY;
                lastX = x;
                lastY = y;
                draw();
                return;
            }
            
            const station = getStationAtPoint(x, y);
            if (station !== hoveredStation) {
                hoveredStation = station;
                canvas.style.cursor = station ? 'pointer' : 'grab';
                draw();
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });
        
        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
        });
        
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const newScale = Math.max(0.3, Math.min(3, scale * delta));
            
            const worldPos = inverseTransformPoint(mouseX, mouseY);
            scale = newScale;
            const newScreenPos = transformPoint(worldPos.x, worldPos.y);
            
            offsetX += mouseX - newScreenPos.x;
            offsetY += mouseY - newScreenPos.y;
            
            draw();
        }, { passive: false });
        
        document.getElementById('zoomIn').addEventListener('click', () => {
            const centerX = width / 2;
            const centerY = height / 2;
            const worldPos = inverseTransformPoint(centerX, centerY);
            scale = Math.min(3, scale * 1.2);
            const newScreenPos = transformPoint(worldPos.x, worldPos.y);
            offsetX += centerX - newScreenPos.x;
            offsetY += centerY - newScreenPos.y;
            draw();
        });
        
        document.getElementById('zoomOut').addEventListener('click', () => {
            const centerX = width / 2;
            const centerY = height / 2;
            const worldPos = inverseTransformPoint(centerX, centerY);
            scale = Math.max(0.3, scale / 1.2);
            const newScreenPos = transformPoint(worldPos.x, worldPos.y);
            offsetX += centerX - newScreenPos.x;
            offsetY += centerY - newScreenPos.y;
            draw();
        });
        
        document.getElementById('zoomReset').addEventListener('click', () => {
            scale = 1;
            offsetX = 0;
            offsetY = 0;
            draw();
        });
        
        document.getElementById('infoClose').addEventListener('click', hideInfoPanel);
        
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.scale(dpr, dpr);
            draw();
        });
        
        draw();
    </script>
</body>
</html>
